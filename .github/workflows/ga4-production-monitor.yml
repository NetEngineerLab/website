name: GA4 Production Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "35 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga4-production-monitor
  cancel-in-progress: true

jobs:
  verify-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify GA4 source configuration
        run: |
          npm run build:config
          npm run test:ga4

      - name: Wait for Cloudflare Pages deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in {1..20}; do
            if npm run check:ga4; then
              exit 0
            fi
            echo "Deployment not ready (attempt ${attempt}/20); retrying in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Check production GA4
        if: github.event_name != 'push'
        run: npm run check:ga4
